<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimnasio Demo · Portal del Socio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background:#000; font-family: ui-sans-serif, system-ui, sans-serif; }
        .view { display:none; }
        .view.activa { display:block; }
        .nav-btn.activo { color:#34d399; }
        .nav-btn.activo .nav-ico { background:rgba(52,211,153,.12); }
        input, select { color-scheme: dark; }
        ::-webkit-scrollbar { width:8px; height:8px; }
        ::-webkit-scrollbar-thumb { background:#1e293b; border-radius:8px; }
    </style>
</head>
<body class="text-slate-100 min-h-screen">

    <!-- Barra de navegación de la DEMO (saltar entre las 3 vistas) -->
    <div class="w-full bg-slate-900 border-b border-slate-800 text-center text-[10px] py-1.5 text-slate-400">
        <span class="text-amber-400 font-bold">DEMO</span> ·
        <a href="index.html" class="text-cyan-400 font-semibold hover:underline">Dashboard</a> ·
        <span class="text-white font-semibold">Portal</span> ·
        <a href="acceso.html" class="text-emerald-400 font-semibold hover:underline">Control de acceso</a>
    </div>

    <!-- ================= LOGIN ================= -->
    <div id="portal-login" class="min-h-screen flex items-center justify-center p-5">
        <div class="w-full max-w-sm bg-slate-950 border border-slate-800 rounded-3xl p-6 space-y-5">
            <div class="text-center space-y-1">
                <div class="mx-auto w-14 h-14 rounded-2xl bg-red-600 flex items-center justify-center text-2xl">
                    <i class="fa-solid fa-dumbbell text-white"></i>
                </div>
                <h1 class="text-xl font-black text-white tracking-tight">Gimnasio Demo</h1>
                <p class="text-xs text-slate-400 font-semibold">Portal del Socio</p>
                <span class="inline-block mt-1 bg-amber-500/15 text-amber-400 border border-amber-500/40 text-[10px] font-black tracking-wider px-2 py-1 rounded-lg">🧪 MODO DEMO</span>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-slate-400 font-semibold block mb-1">Ingresá como socio (demo)</label>
                    <select id="login-cliente" class="w-full bg-black border border-slate-800 rounded-xl p-3 text-white text-sm"></select>
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 font-semibold block mb-1">Clave</label>
                    <input id="login-clave" type="password" value="demo1234" class="w-full bg-black border border-slate-800 rounded-xl p-3 text-white text-sm" placeholder="Cualquier clave sirve en la demo">
                </div>
                <button onclick="portalLogin()" class="w-full py-3 rounded-xl font-black text-sm bg-gradient-to-r from-emerald-500 to-teal-500 text-black hover:brightness-110 transition">
                    Entrar
                </button>
                <p class="text-[10px] text-slate-500 text-center leading-relaxed">
                    Tu cuenta la crea el gimnasio; acá solo ingresás.<br>Demo: elegí cualquier socio y entrá con cualquier clave (nada se guarda; al recargar vuelve al inicio).
                </p>
            </div>
        </div>
    </div>

    <!-- ================= APP ================= -->
    <div id="portal-app" class="hidden max-w-md mx-auto min-h-screen flex flex-col">

        <!-- Header -->
        <header class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur border-b border-slate-900 px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-dumbbell text-white text-sm"></i>
                </div>
                <div class="min-w-0">
                    <p class="text-sm font-black text-white leading-none truncate" id="hdr-nombre">Socio</p>
                    <p class="text-[10px] text-amber-400 font-semibold leading-none mt-0.5">MODO DEMO</p>
                </div>
            </div>
            <button onclick="portalLogout()" class="text-slate-400 hover:text-rose-400 text-sm px-3 py-2 rounded-xl border border-slate-800" title="Salir">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </header>

        <!-- Contenido -->
        <main class="flex-1 p-4 pb-28 space-y-4">
            <section id="view-inicio"   class="view activa space-y-4"></section>
            <section id="view-reservar" class="view space-y-4"></section>
            <section id="view-datos"    class="view space-y-4"></section>
            <section id="view-pagos"    class="view space-y-4"></section>
            <section id="view-avances"  class="view space-y-4"></section>
        </main>

        <!-- Bottom nav -->
        <nav class="fixed bottom-0 inset-x-0 z-40 bg-slate-950/95 backdrop-blur border-t border-slate-900">
            <div class="max-w-md mx-auto grid grid-cols-5">
                <button data-view="inicio"   onclick="irA('inicio')"   class="nav-btn activo flex flex-col items-center gap-1 py-2.5 text-[10px] font-bold text-slate-400 transition">
                    <span class="nav-ico w-9 h-7 rounded-lg flex items-center justify-center"><i class="fa-solid fa-house"></i></span>Inicio
                </button>
                <button data-view="reservar" onclick="irA('reservar')" class="nav-btn flex flex-col items-center gap-1 py-2.5 text-[10px] font-bold text-slate-400 transition">
                    <span class="nav-ico w-9 h-7 rounded-lg flex items-center justify-center"><i class="fa-solid fa-qrcode"></i></span>Reservar
                </button>
                <button data-view="datos"    onclick="irA('datos')"    class="nav-btn flex flex-col items-center gap-1 py-2.5 text-[10px] font-bold text-slate-400 transition">
                    <span class="nav-ico w-9 h-7 rounded-lg flex items-center justify-center"><i class="fa-solid fa-id-card"></i></span>Mis datos
                </button>
                <button data-view="pagos"    onclick="irA('pagos')"    class="nav-btn flex flex-col items-center gap-1 py-2.5 text-[10px] font-bold text-slate-400 transition">
                    <span class="nav-ico w-9 h-7 rounded-lg flex items-center justify-center"><i class="fa-solid fa-credit-card"></i></span>Pagos
                </button>
                <button data-view="avances"  onclick="irA('avances')"  class="nav-btn flex flex-col items-center gap-1 py-2.5 text-[10px] font-bold text-slate-400 transition">
                    <span class="nav-ico w-9 h-7 rounded-lg flex items-center justify-center"><i class="fa-solid fa-chart-line"></i></span>Avances
                </button>
            </div>
        </nav>
    </div>

    <!-- Datos + Api simulado + módulo de acceso + lógica del portal -->
    <script src="js/demo-data.js"></script>
    <script src="js/config-demo.js"></script>
    <script src="js/api-demo.js"></script>
    <script src="js/acceso-demo.js"></script>
    <script src="js/horarios-demo.js"></script>
    <script src="js/portal.js"></script>
</body>
</html>
